services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      # Default DB; init script also creates creditworthiness + monitoring
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailhog:
    image: mailhog/mailhog:v1.0.1
    platform: linux/amd64
    ports:
      - "1025:1025"
      - "8025:8025"

  backend:
    build:
      context: ./backend/creditworthiness-checker
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/creditworthiness
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      PCR_BASE_URL: http://backend:8080
      MOCK_PCR_AVAILABLE: "true"
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/v3/api-docs >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

  monitoring:
    build:
      context: ./backend/MonitoringService
    depends_on:
      postgres:
        condition: service_healthy
      backend:
        condition: service_healthy
      mailhog:
        condition: service_started
    environment:
      SERVER_PORT: "8081"
      DB_URL: jdbc:postgresql://postgres:5432/monitoring
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      MONITORING_BACKEND_URL: http://backend:8080
      MONITORING_CRON: "0 */1 * * * *"
      MAIL_HOST: mailhog
      MAIL_PORT: "1025"
      MONITORING_MAIL_TO: pcr_monitoring@dansketest.dk
    ports:
      - "8081:8081"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE: ""
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  postgres_data:
